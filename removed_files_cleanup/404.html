<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      const redirectPath = location.pathname + location.search + location.hash;
      window.location.replace(
        `/My-Portfolio/?redirect=${encodeURIComponent(redirectPath)}`,
      );
    </script>
  </head>
  <body></body>
</html>
